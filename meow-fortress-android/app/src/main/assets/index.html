<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meow Fortress</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>

:root{--bg:#0f1a38;--ink:#2b1a3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:#fff;font:19px "Lilita One",ui-rounded,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{position:relative;display:flex;align-items:center;justify-content:center}
.sc{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:12px;gap:10px;overflow:auto;box-sizing:border-box;animation:in .35s cubic-bezier(.2,.9,.3,1.1)}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.97)}}
.bgm{background:radial-gradient(circle at 50% -10%,#4a6cf0,transparent 60%),radial-gradient(#fff3 1.5px,transparent 2px) 0 0/30px 30px,var(--bg);animation:in .35s ease-out,drift 24s linear infinite}
@keyframes drift{to{background-position:0 0,30px 60px,0 0}}
.ov{background:#000c;backdrop-filter:blur(3px);justify-content:center;z-index:9;text-align:center}#ad{z-index:10}
#res{justify-content:center;text-align:center}
.btn{font:inherit;font-size:19px;color:#fff;border:3px solid #131c36;border-radius:14px;padding:9px 16px;background:linear-gradient(#7d9bff,#4c6fff);text-shadow:0 2px 0 #0006;box-shadow:inset 0 3px 0 #fff4,inset 0 -5px 0 #0003,0 4px 0 #0a1020,0 8px 14px #0005;display:flex;align-items:center;gap:6px;cursor:pointer;position:relative;overflow:hidden;transition:transform .08s,filter .2s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(100deg,transparent,#fff7,transparent);transform:skewX(-20deg);animation:shine 3.4s infinite}
@keyframes shine{55%,to{left:140%}}
.btn:active{transform:translateY(3px) scale(.97)}.btn:disabled{opacity:.45;filter:grayscale(.5)}.btn:disabled::after{display:none}
.go{background:linear-gradient(#5be38c,#22b05a)}.org{background:linear-gradient(#ffb04a,#ff7a00)}
.glow{animation:glow 1s ease-in-out infinite alternate}@keyframes glow{to{box-shadow:inset 0 -5px 0 #0003,0 4px 0 #0a1020,0 0 20px 5px #ffd84acc;filter:brightness(1.15)}}
.pill{background:#0008;border:3px solid #131c36;border-radius:20px;padding:3px 12px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.pill img,.btn img{width:22px}.top{display:flex;justify-content:space-between;width:100%;max-width:420px}
.logo{margin:0;font-size:42px;font-weight:400;color:#ffd84a;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);animation:lg 2.6s ease-in-out infinite alternate}
@keyframes lg{to{filter:drop-shadow(0 0 14px #ffd84acc);transform:translateY(-3px)}}
.c{display:flex;align-items:center;gap:8px;width:100%;max-width:420px;box-sizing:border-box;padding:8px 10px;border-radius:16px;border:3px solid #131c36;background:linear-gradient(#41589f,#2b3c72);box-shadow:inset 0 2px 0 #fff2,0 4px 0 #0a1020,0 8px 16px #0005}
.c.in{animation:in .4s backwards;animation-delay:calc(var(--i)*70ms)}.c.up{animation:up .5s}
@keyframes up{40%{transform:scale(1.05);filter:brightness(1.5)}}
.c .ic{width:44px;background:#0004;border-radius:10px;padding:4px}.c .t{flex:1;display:flex;flex-direction:column;text-align:left;gap:2px}.c small{opacity:.85;font-size:14px}
.pips{display:flex;gap:3px}.pips i{width:9px;height:9px;border-radius:50%;background:#0006}.pips i.on{background:#ffd84a;box-shadow:0 0 6px #ffd84a}
.bx{display:flex;flex-direction:column;gap:5px}.bx .btn{font-size:16px;padding:5px 10px;justify-content:center}
.tip{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:6px 14px;font-size:17px;box-shadow:0 4px 0 #0a1020;position:relative;margin-bottom:10px;animation:tb 1s ease-in-out infinite alternate}
.tip::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--ink);border-bottom:0}
@keyframes tb{to{transform:translateY(-7px)}}
#hero{width:104px;animation:bob 1.1s ease-in-out infinite alternate}
#stars img{width:46px;animation:in .5s backwards}#stars img:nth-child(2){animation-delay:.2s}#stars img:nth-child(3){animation-delay:.4s}
#game{padding:0}#cv{width:100%;height:100%;display:block;touch-action:none}
#tb{position:absolute;left:0;right:0;margin:auto;width:max-content;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:2;font-size:18px}
#tb.sh{animation:shk .3s}@keyframes shk{25%{translate:-7px 0}75%{translate:7px 0}}
#bn{margin-top:auto;width:100%;max-width:320px;min-height:50px;background:#fff2;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.7}
#gift{position:absolute;width:46px;display:none;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(-8px) rotate(4deg)}}
#st{position:relative;flex:none;overflow:hidden;background:var(--bg);aspect-ratio:9/16;width:min(100%,56.25vh)}
#ld{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(circle at 50% 28%,#ffffff22,transparent 62%),radial-gradient(#fff3 1.5px,transparent 2px) 0 0/30px 30px,#435ac2;transition:opacity .45s}
#ld.x{opacity:0;pointer-events:none}
#ld img{width:48%;border-radius:12%;border:5px solid var(--ink);box-shadow:0 8px 0 #0a1020,0 0 44px #ffd84a66;animation:ldb .9s ease-in-out infinite alternate}
@keyframes ldb{to{transform:translateY(-14px) rotate(-3deg)}}
#ld .bar{width:62%;height:24px;box-sizing:border-box;border:4px solid var(--ink);border-radius:14px;background:#0007;overflow:hidden}
#ld .bar i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(#ffe27a,#ffb02e)}
#ld p{margin:0;font-size:17px}
</style></head><body><div id="st">
<div id="home" class="sc bgm">
 <div class="top"><div class="pill"><img id="ci"><span id="co"></span></div><div class="pill" id="pw"></div><div class="pill" id="lv"></div></div>
 <img id="hero"><h1 class="logo">Meow Fortress</h1>
 <div id="ups" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:8px"></div>
 <div class="tip" id="tip" style="display:none"></div>
 <button class="btn go" id="play" style="font-size:24px;padding:12px 44px"></button>
 <div id="bn">Banner ad (test)</div><img id="gift">
</div>
<div id="game" class="sc"><canvas id="cv"></canvas><button class="btn org" id="tb"></button></div>
<div id="res" class="sc bgm"><h1 class="logo" id="rt"></h1><div id="stars"></div>
 <div class="pill" style="font-size:26px"><img id="ci2" style="width:30px"><span id="rc"></span></div>
 <canvas id="wh" width="440" height="460" style="width:220px;height:230px"></canvas>
 <button class="btn" id="sp">SPIN!</button><button class="btn org" id="cl" style="display:none"></button><button class="btn go" id="rn">Continue</button></div>
<div id="mod" class="sc ov"><h2 id="mt"></h2><p id="mm"></p><button class="btn org" id="my">Watch ►</button><button class="btn" id="mn">No thanks</button></div>
<div id="ad" class="sc ov"><h2 id="adt"></h2><p>Real ads play here in the app build.</p><button class="btn" id="adb"></button></div>
